<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coaster builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#fff1c2; --panel-2:#ffe7a1; --ink:#5b2a48; --ink-soft:#8a5c78;
  --edge:#e9cf86; --accent:#d6456b; --accent-ink:#fff6dc; --teal:#2f9c95; --good:#3c9a5f; --shadow:rgba(91,42,72,.22);
  --sky-a:#bfe6e6; --sky-b:#fde8bf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#3b2440; --panel-2:#4a2e50; --ink:#ffe9b8; --ink-soft:#d9b9c6;
    --edge:#5e3c63; --accent:#f0688a; --accent-ink:#2b1730; --teal:#58c7bf; --good:#7fd79b; --shadow:rgba(0,0,0,.45);
    --sky-a:#1d2444; --sky-b:#4a3562;
  }
}
:root[data-theme="dark"]{
  --panel:#3b2440; --panel-2:#4a2e50; --ink:#ffe9b8; --ink-soft:#d9b9c6;
  --edge:#5e3c63; --accent:#f0688a; --accent-ink:#2b1730; --teal:#58c7bf; --good:#7fd79b; --shadow:rgba(0,0,0,.45);
  --sky-a:#1d2444; --sky-b:#4a3562;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:linear-gradient(180deg,var(--sky-a),var(--sky-b)); color:var(--ink); overflow:hidden;
  font-family:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif; font-size:15px; line-height:1.3;
  -webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:16px;box-shadow:0 4px 0 var(--edge),0 10px 22px var(--shadow)}
.btn{height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--edge);background:var(--panel-2);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.btn.warn{background:#c9413f;color:#fff;border-color:#c9413f}

#top{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:6px;z-index:5;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 370px)}
#build{
  position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:330px;display:flex;flex-direction:column;z-index:6;overflow:hidden;
}
#build header{padding:12px 14px 10px;border-bottom:2px solid var(--edge)}
#build h1{margin:0 0 8px;font-size:22px;font-weight:800;line-height:1}
.row{display:flex;gap:8px;align-items:center}
#coaster{flex:1;min-width:0;height:38px;border-radius:10px;border:2px solid var(--edge);background:var(--panel-2);padding:0 8px;font-weight:600}
.sw{display:flex;gap:6px;flex:none}
.sw button{width:24px;height:24px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--edge);padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
#status{padding:10px 14px 0;display:flex;flex-wrap:wrap;gap:6px}
#status span{background:var(--panel-2);border:1.5px solid var(--edge);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
#status span.ok{background:var(--good);border-color:var(--good);color:#fff;font-weight:800}
#status b{font-weight:800}
#tabs{display:flex;gap:6px;padding:10px 14px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;border:2px solid var(--edge);background:none;border-radius:999px;padding:3px 11px;font-weight:800;font-size:12.5px}
#tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#cands{flex:1;overflow:auto;padding:2px 10px 8px;overscroll-behavior:contain;min-height:0}
#cands button{
  display:flex;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:9px;font-weight:600;font-size:14px;gap:6px;align-items:baseline;
}
#cands button:hover{background:var(--panel-2)}
#cands button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#cands button.bad{opacity:.55}
#cands .x{margin-left:auto;font-size:11px;font-weight:800;opacity:.8;white-space:nowrap}
#cands p{margin:14px 8px;color:var(--ink-soft);font-weight:600}
#act{display:flex;gap:8px;padding:10px 12px 12px;border-top:2px solid var(--edge)}
#act .go{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#speed{position:fixed;left:356px;top:calc(14px + env(safe-area-inset-top,0px));font-weight:800;font-size:14px;z-index:4;pointer-events:none;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:5px 11px;max-width:calc(100vw - 380px)}
#speed:empty{display:none}
#speed small{display:block;font-weight:600;font-size:12.5px;color:var(--ink-soft)}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);padding:9px 16px;font-weight:800;z-index:9;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
  #top{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));max-width:none;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  #top .btn{flex:none;padding:0 9px}
  #build{left:0;right:0;top:auto;bottom:0;width:auto;height:52%;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #build header{padding:8px 12px;display:flex;gap:8px;align-items:center}
  #build h1{display:none}
  #build header .row{flex:1;min-width:0}
  #status{padding:8px 12px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:none}
  #status span{white-space:nowrap;flex:none}
  .sw button{width:22px;height:22px}
  #tabs{padding:8px 12px 4px}
  #speed{left:8px;top:calc(64px + env(safe-area-inset-top,0px));max-width:calc(100vw - 16px)}
  .btn{height:38px;padding:0 10px;font-size:13.5px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="3D view of your coaster"></canvas>
<div id="speed"></div>

<div id="top" class="panel">
  <button class="btn" id="ride" aria-pressed="false">Ride</button>
  <button class="btn" id="boxes" aria-pressed="false">Clearance</button>
  <button class="btn" id="fit">Fit</button>
  <button class="btn" id="example">Example</button>
  <button class="btn" id="clear">Clear</button>
</div>

<aside id="build" class="panel">
  <header>
    <h1>Coaster builder</h1>
    <div class="row">
      <select id="coaster" aria-label="Coaster type"></select>
      <div class="sw" id="sw"></div>
    </div>
  </header>
  <div id="status"></div>
  <div id="tabs" role="group" aria-label="Piece families"></div>
  <div id="cands"></div>
  <div id="act">
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="lift" aria-pressed="false" title="Put a lift chain on the next piece (C)">Chain</button>
    <button class="btn go" id="add">Build</button>
  </div>
</aside>
<div id="toast" class="panel"></div>

  const k = (s - path.cum[lo]) / Math.max(1e-6, path.cum[hi] - path.cum[lo]);
  out.c.lerpVectors(path.C[lo], path.C[hi], k); out.u.lerpVectors(path.U[lo], path.U[hi], k).normalize();
  out.t.lerpVectors(path.T[lo], path.T[hi], k).normalize(); out.s.crossVectors(out.t, out.u).normalize(); out.u.crossVectors(out.s, out.t).normalize();
  out.kind = path.st[lo]; return out;
}

/* ───────── train physics ─────────
   One tile is 3 m (the game's own height scale), so gravity is 9.81 / 3 tiles per second squared.
   Every car feels the slope under it; the train moves on the average. Rolling resistance and air drag
   take energy away. A lift chain pulls at a fixed speed and stops roll-back. Stations and brakes slow
   the train, boosters push it. With no chain and not enough speed the train stalls and rolls back. */
const PHY = { g: 9.81 / 3, roll: 0.04, drag: 0.0021, lift: 1.2, station: 1.6, brake: 2.0, boost: 6, n: 4, gap: 0.46, friction: true };
const train = { s: 0, v: 0, state: 'dwell', timer: 2, cars: [], departing: false, still: 0, back: false, gV: 1, gL: 0, onLift: false, lap: null, last: null, laps: 0, note: '' };
for (let k = 0; k < PHY.n; k++) {
  const car = new THREE.Group();
  const body = new THREE.Mesh(unitBox, mat.car); body.scale.set(0.27, 0.11, 0.4); body.position.y = 0.115; body.castShadow = true; car.add(body);
  const base = new THREE.Mesh(unitBox, mat.dark); base.scale.set(0.2, 0.04, 0.34); base.position.y = 0.05; car.add(base);
  for (const sx of [-0.065, 0.065]) { const h = new THREE.Mesh(headGeo, mat.skin); h.position.set(sx, 0.215, -0.02); car.add(h); }
  car.matrixAutoUpdate = false; scene.add(car); train.cars.push(car);
}
const G2 = fr(), G3 = fr(), TLEN = (PHY.n - 1) * PHY.gap;
const newLap = () => ({ t: 0, maxV: 0, maxG: 1, minG: 1, maxL: 0, eMin: Infinity, eMax: -Infinity });
function resetTrain() {
  const stop = Math.max(TLEN + 0.05, path.stEnd - 0.15);
  Object.assign(train, { s: Math.min(stop, Math.max(0, path.len)), v: 0, state: 'dwell', timer: 2, departing: false, still: 0, back: false, gV: 1, gL: 0, lap: newLap(), note: '' });
  train.stop = stop;
}
function stepTrain(h) {
  if (path.len < TLEN + 0.5) return;

  // slope under every car
  let a = 0, lift = false, brake = false, boost = false, station = false, hsum = 0;
  for (let i = 0; i < PHY.n; i++) {
    const q = atPath(train.s - i * PHY.gap, G3); a -= PHY.g * q.t.y; hsum += q.c.y;
    if (q.kind === 1) station = true; else if (q.kind === 2) lift = true; else if (q.kind === 3) brake = true; else if (q.kind === 4) boost = true;
  }

    const res = PHY.roll + PHY.drag * v * v;
    if (Math.abs(v) < 0.02 && Math.abs(a) <= PHY.roll && !station && !lift && !boost) { a = 0; v = 0; } else a -= Math.sign(v || a) * res;
  }

  if (boost && v >= 0 && v < PHY.boost) v += 3 * h;

  if (station) {
    if (v < 0) { v = Math.min(0, v + 8 * h); if (v === 0) { train.state = 'stalled'; train.timer = 2.5; train.note = 'Rolled back into the station'; } }
    else if (train.departing) { if (v < PHY.station) v = Math.min(PHY.station, v + 2 * h); }
    else if (front <= train.stop && path.stEnd > 0) {                                         // arriving: station brakes
      const vmax = Math.sqrt(2 * 5 * Math.max(0, train.stop - front)) + 0.12;
      if (v > vmax) v = vmax; if (v < 0.35) v = 0.35;
      if (front + v * h >= train.stop) {
        train.s += train.stop - front; train.v = 0; train.state = 'dwell'; train.timer = 3; train.laps++;
        train.last = train.lap; train.gV = 1; train.gL = 0; return;
      }
    } else if (v < PHY.station) v = Math.min(PHY.station, v + 2 * h);
  } else train.departing = false;
  // what the riders feel: curvature of the path at the middle of the train
  const mid = train.s - TLEN / 2, d = 0.25, qa = atPath(mid - d, G2), ta = tmp.copy(qa.t), qb = atPath(mid + d, G2), kx = (qb.t.x - ta.x) / (2 * d), ky = (qb.t.y - ta.y) / (2 * d), kz = (qb.t.z - ta.z) / (2 * d);
  const qm = atPath(mid, G2), gv = (v * v * (kx * qm.u.x + ky * qm.u.y + kz * qm.u.z)) / PHY.g + qm.u.y, gl = (v * v * (kx * qm.s.x + ky * qm.s.y + kz * qm.s.z)) / PHY.g + qm.s.y;
  const lp = Math.min(1, h * 12); train.gV += (gv - train.gV) * lp; train.gL += (gl - train.gL) * lp;
  train.s += v * h; train.v = v; train.onLift = lift; train.back = v < -0.05;
  const L = train.lap; L.t += h; L.maxV = Math.max(L.maxV, v); L.maxG = Math.max(L.maxG, train.gV); L.minG = Math.min(L.minG, train.gV); L.maxL = Math.max(L.maxL, Math.abs(train.gL));
  if (!lift && !brake && !boost && !station) { const e = v * v / 2 + PHY.g * hsum / PHY.n; L.eMin = Math.min(L.eMin, e); L.eMax = Math.max(L.eMax, e); if (L.e0 === undefined) L.e0 = e; L.e1 = e; }

  if (!closed) {
    if (train.s >= path.len) { train.s = path.len; train.v = 0; train.state = 'end'; train.timer = 2; train.note = 'Reached the end of the track'; return; }
    if (train.s < TLEN) { train.s = TLEN; train.v = 0; train.state = 'stalled'; train.timer = 2.5; train.note = 'Rolled back to the start'; return; }
  } else train.s = ((train.s % path.len) + path.len) % path.len;
  // stalled in a valley or on a crest
  if (!lift && !station && Math.abs(v) < 0.03) { train.still += h; if (train.still > 1) { train.state = 'stalled'; train.timer = 3; train.note = 'Stalled: not enough speed'; } } else train.still = 0;
}
const kmh = v => Math.round(Math.abs(v) * 3 * 3.6);
let acc = 0;
function updateTrain(dt) {
  if (path.len < TLEN + 0.5) { train.cars.forEach(c => c.visible = false); $('speed').textContent = ''; return; }
  acc = Math.min(acc + dt, 0.1); while (acc >= 1 / 120) { stepTrain(1 / 120); acc -= 1 / 120; }
  train.cars.forEach((car, i) => {
    car.visible = true; const q = atPath(train.s - i * PHY.gap, G2); car.matrix.makeBasis(q.s, q.u, q.t); car.matrix.setPosition(q.c);
  });
  const what = train.state === 'dwell' ? 'Loading riders' : train.state !== 'run' ? train.note : train.back ? 'Rolling back' : train.onLift ? 'On the lift chain' : '';
  let html = train.state === 'run' ? `${kmh(train.v)} km/h, ${train.gV.toFixed(1)} G` : what;
  if (train.state === 'run' && what) html += ', ' + what.toLowerCase();
  const l = train.last;
  if (l) html += `<small>Last lap: top speed ${kmh(l.maxV)} km/h, ${l.maxG.toFixed(1)} G down, ${l.minG.toFixed(1)} G lightest, ${l.maxL.toFixed(1)} G sideways, ${Math.round(l.t)} s</small>`;
  if ($('speed').innerHTML !== html) $('speed').innerHTML = html;

/* ───────── top buttons ───────── */
let riding = false;
$('ride').addEventListener('click', () => { riding = !riding; $('ride').setAttribute('aria-pressed', riding); $('build').style.display = riding && narrow() ? 'none' : ''; });
function fitAll() {
  if (!path.C.length) { cam.targetT.set(2, 0.5, 0); cam.zoomT = 6; return; }
  const b = new THREE.Box3(); path.C.forEach(c => b.expandByPoint(c)); b.min.y = 0;
  const r = viewRect(), asp = window.innerWidth / window.innerHeight, sx = b.max.x - b.min.x, sz = b.max.z - b.min.z, sy = b.max.y;
  const wide = Math.hypot(sx, sz) + 2, tall = sy + Math.hypot(sx, sz) * 0.6 + 2;
  cam.zoomT = clamp(Math.max(tall / 2 / (r.h / window.innerHeight), wide / 2 / (r.w / window.innerWidth) / asp), 2, 60);
  b.getCenter(cam.targetT);
}
$('fit').addEventListener('click', fitAll);
$('example').addEventListener('click', () => { setTrack(EXAMPLE); train.last = null; rebuildAll(); fitAll(); save(); });
let armed = 0;
$('clear').addEventListener('click', () => {
  const b = $('clear');
  if (Date.now() < armed) { armed = 0; b.textContent = 'Clear'; b.classList.remove('warn'); setTrack(['middleStation', 'middleStation', 'middleStation']); train.last = null; rebuildAll(); fitAll(); cam.zoomT = 6; save(); return; }
  armed = Date.now() + 3000; b.textContent = 'Erase?'; b.classList.add('warn');
  setTimeout(() => { if (armed && Date.now() >= armed) { armed = 0; b.textContent = 'Clear'; b.classList.remove('warn'); } }, 3100);
});

/* ───────── orbit, pan, zoom ───────── */
const ptrs = new Map(); let pinch = 0, mid = null;
function panBy(dx, dy) {
  const wpp = 2 * cam.zoom / window.innerHeight, sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw), k = dy * wpp / Math.sin(cam.el);
  cam.targetT.x += -sy * dx * wpp - cy * k; cam.targetT.z += cy * dx * wpp - sy * k; cam.target.copy(cam.targetT);
}
canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (pinch) cam.zoomT = cam.zoom = clamp(cam.zoom * pinch / Math.max(1, d), 1.5, 60);
    if (mid) panBy(m.x - mid.x, m.y - mid.y);
    pinch = d; mid = m; return;
  }
  if (p.btn === 2 || p.btn === 1 || e.shiftKey) { panBy(dx, dy); return; }
  cam.yawT += dx * 0.008; cam.elT = clamp(cam.elT + dy * 0.006, 0.12, 1.5);
});
const up = e => { ptrs.delete(e.pointerId); pinch = 0; mid = null; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.zoomT = clamp(cam.zoomT * (e.deltaY > 0 ? 1.1 : 0.9), 1.5, 60); }, { passive: false });

/* ───────── save / load ───────── */
function save() { try { localStorage.setItem(KEY, JSON.stringify({ seq: packTrack(), coaster: sel.value, rail: railHex })); } catch (e) {} }
(function load() {
  let d = null; try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!d) {   // a track saved before lift chains existed: put a chain on its climbs so it still runs
    try { const o = JSON.parse(localStorage.getItem(OLDKEY) || 'null');
      if (o && Array.isArray(o.seq) && o.seq.every(n => P[n]) && !(o.seq.length === 31 && o.seq[19] === 'down60ToDown25'))
        d = { seq: o.seq.map(n => n + (P[n].flags.includes('allowLiftHill') && /^up|ToUp/.test(n) ? '+' : '')), coaster: o.coaster, rail: o.rail };
    } catch (e) {}
  }
  const ok = d && Array.isArray(d.seq) && d.seq.every(n => typeof n === 'string' && P[n.replace(/\+$/, '')]);
  setTrack(ok ? d.seq : EXAMPLE);
  sel.value = ok && typeof d.coaster === 'string' && [...sel.options].some(o => o.value === d.coaster) ? d.coaster : 'LoopingRollerCoaster';
  coaster = DATA.coasters.find(c => c.id === sel.value) || null;
  pickRail(ok && RAILS.includes(d.rail) ? d.rail : RAILS[0]);
})();
window.__test = {
  load: s => { setTrack(s); train.last = null; train.laps = 0; rebuildAll(); },
  trace: (secs, every) => { resetTrain(); const out = []; for (let i = 0; i < secs * 120; i++) { stepTrain(1 / 120); if (i % (every * 120) === 0) out.push([i / 120, +train.s.toFixed(1), +train.v.toFixed(2), train.state, train.gV.toFixed(1), train.gL.toFixed(1)]); } resetTrain(); return out; },
  sim: (secs, friction) => { PHY.friction = friction !== false; resetTrain(); train.laps = 0; train.last = null; const notes = []; let back = false, maxV = 0, minOff = Infinity;
    for (let i = 0; i < secs * 120; i++) { const st0 = train.state; stepTrain(1 / 120); if (train.back) back = true; maxV = Math.max(maxV, train.v);
      if (train.state !== st0 && (train.state === 'stalled' || train.state === 'end')) notes.push(train.note + ' at ' + Math.round(train.s * 10) / 10); if (notes.length > 2) break; }
    const l = train.last || train.lap; PHY.friction = true;
    const out = { laps: train.laps, rolledBack: back, notes, topKmh: kmh(maxV), lapTime: train.last ? Math.round(train.last.t) : null, maxG: +l.maxG.toFixed(2), minG: +l.minG.toFixed(2), latG: +l.maxL.toFixed(2), energySpread: +((l.eMax - l.eMin) / l.eMax).toFixed(4), energyEndVsStart: +((l.e1 - l.e0) / l.e0).toFixed(4) };
    resetTrain(); return out; },
  cands: () => cands.map(c => [c.n, c.bad]),
  supports: () => supportCount,
  selfHits: () => { let n = 0; let st = { pos: START.pos.clone(), heading: 0, pitch: 'none', roll: 'none' }; const m = new Map();
    seq.forEach((nm, i) => { const bl = blocksOf(nm, st, i); if (hits(bl, m)) n++; for (const b of bl) { const k = b.kx + ',' + b.kz; if (!m.has(k)) m.set(k, []); m.get(k).push(b); } st = advance(st, nm); }); return n; },
  pairCheck: () => { const bad = []; let pairs = 0;
    for (const a of NAMES) { const A = P[a]; const st = { pos: new THREE.Vector3(0, 8, 0), heading: A.diag[0] ? 45 : 0, pitch: A.ps, roll: A.rs };
      const m = new Map(); for (const b of blocksOf(a, st, 0)) { const k = b.kx + ',' + b.kz; if (!m.has(k)) m.set(k, []); m.get(k).push(b); }
      const st2 = advance(st, a);
      for (const b of NAMES) if (fits(st2, P[b])) { pairs++; if (hits(blocksOf(b, st2, 1), m)) bad.push(a + ' > ' + b); } }
    return { pairs, bad }; },
  state: () => ({ n: seq.length, closed, head: head && { x: head.pos.x, y: head.pos.y, z: head.pos.z, h: head.heading }, len: path.len, v: train.v, s: train.s, cands: cands.length }) };

/* ───────── go ───────── */
resize(); rebuildAll(); fitAll(); cam.zoom = cam.zoomT; cam.target.copy(cam.targetT);
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000), k = Math.min(1, dt * 8); prev = now;
  cam.yaw += (cam.yawT - cam.yaw) * k; cam.el += (cam.elT - cam.el) * k; cam.zoom += (cam.zoomT - cam.zoom) * k; cam.target.lerp(cam.targetT, k);
  placeCamera(); updateTrain(dt);

  sun.position.set(cam.target.x + 8, 22, cam.target.z + 5); sun.target.position.set(cam.target.x, 0, cam.target.z);
  const ext = clamp(cam.zoom * 1.6, 8, 40); const sc = sun.shadow.camera;
  if (sc.right !== ext) { sc.left = sc.bottom = -ext; sc.right = sc.top = ext; sc.updateProjectionMatrix(); }
  ground.position.x = Math.round(cam.target.x / 2) * 2; ground.position.z = Math.round(cam.target.z / 2) * 2;
  let camera = ortho;
  if (riding && path.len > 1.5) {
    const q = atPath(train.s + 0.1, G2);
    pov.position.copy(q.c).addScaledVector(q.u, 0.34); pov.up.copy(q.u);
    tmp.copy(q.c).addScaledVector(q.t, 2).addScaledVector(q.u, 0.3); pov.lookAt(tmp); camera = pov;
    train.cars[0].visible = false;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
