<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Building kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#fff1c2; --panel-2:#ffe7a1; --ink:#5b2a48; --ink-soft:#8a5c78;
  --edge:#e9cf86; --accent:#d6456b; --accent-ink:#fff6dc; --teal:#2f9c95; --shadow:rgba(91,42,72,.22);
  --sky-a:#bfe6e6; --sky-b:#fde8bf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#3b2440; --panel-2:#4a2e50; --ink:#ffe9b8; --ink-soft:#d9b9c6;
    --edge:#5e3c63; --accent:#f0688a; --accent-ink:#2b1730; --teal:#58c7bf; --shadow:rgba(0,0,0,.45);
    --sky-a:#1d2444; --sky-b:#4a3562;
  }
}
:root[data-theme="dark"]{
  --panel:#3b2440; --panel-2:#4a2e50; --ink:#ffe9b8; --ink-soft:#d9b9c6;
  --edge:#5e3c63; --accent:#f0688a; --accent-ink:#2b1730; --teal:#58c7bf; --shadow:rgba(0,0,0,.45);
  --sky-a:#1d2444; --sky-b:#4a3562;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:linear-gradient(180deg,var(--sky-a),var(--sky-b)); color:var(--ink); overflow:hidden;
  font-family:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif; font-size:15px; line-height:1.3;
  -webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:16px;box-shadow:0 4px 0 var(--edge),0 10px 22px var(--shadow)}
.btn{height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--edge);background:var(--panel-2);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-soft)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#side{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:310px;display:flex;flex-direction:column;z-index:6;overflow:hidden}
#side header{padding:12px 14px 10px;border-bottom:2px solid var(--edge)}
#side h1{margin:0;font-size:22px;font-weight:800;line-height:1}
#side header p{margin:6px 0 0;font-size:12.5px;color:var(--ink-soft)}
#list{overflow:auto;flex:1;padding:4px 8px 12px;overscroll-behavior:contain}
#list h2{font-size:15px;font-weight:800;margin:16px 6px 2px}
#list h3{font-size:12.5px;font-weight:800;margin:10px 6px 2px;color:var(--ink-soft);display:flex;justify-content:space-between}
#list button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:9px;font-weight:600;font-size:14px}
#list button small{display:block;font-weight:400;font-size:12px;opacity:.8}
#list button:hover{background:var(--panel-2)}
#list button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
#list button.all{border:2px solid var(--edge);margin:4px 0}
#closeList{display:none}
#info{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:346px;padding:12px 14px;z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#info .t{flex:1 1 280px;min-width:0}
#pname{font-size:21px;font-weight:800;line-height:1.1;margin:0 0 2px}
#pdesc{margin:0 0 6px;font-size:13.5px;color:var(--ink-soft)}
#chips{display:flex;flex-wrap:wrap;gap:6px}
#chips span{background:var(--panel-2);border:1.5px solid var(--edge);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
#chips b{font-weight:800}
#nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#openList{display:none}
#cols{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600}
#cols label{display:flex;align-items:center;gap:3px}
#cols input{width:34px;height:34px;border:2px solid var(--edge);border-radius:10px;padding:2px;background:var(--panel-2)}
#tog{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:6px;z-index:5}
#scrim{display:none}
@media (max-width:820px){
  #side{left:0;right:0;top:auto;bottom:0;width:auto;height:74%;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
  body.open #side{transform:none}
  #closeList{display:block;position:absolute;right:10px;top:8px;height:36px}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:5}
  body.open #scrim{display:block}
  #info{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:10px 12px;gap:8px}
  #pname{font-size:18px}
  #nav{width:100%}
  #nav .btn{flex:1}
  #openList{display:block}
  #tog{right:8px;top:calc(8px + env(safe-area-inset-top,0px))}
  .btn{height:38px;padding:0 10px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D view of the selected building part"></canvas>
<div id="tog" class="panel">
  <button class="btn" id="tBox" aria-pressed="false" title="Show the size the game gives this object">Game size</button>
  <button class="btn" id="tSpin" aria-pressed="false">Turn</button>
</div>
<div id="scrim"></div>
<aside id="side" class="panel">
  <header><h1>Building kit</h1><button class="btn" id="closeList">Close</button><p>Names, footprints, heights and colour channels come from the game. The shapes are new models.</p></header>
  <div id="list"></div>
</aside>
<section id="info" class="panel">
  <div class="t"><h2 id="pname"></h2><p id="pdesc"></p><div id="chips"></div></div>
  <div id="nav">
    <div id="cols"></div>
    <button class="btn" id="prev" aria-label="Previous">‹</button>
    <button class="btn" id="openList">All parts</button>
    <button class="btn" id="next" aria-label="Next">›</button>
  </div>
</section>

/* ───────── views ───────── */
let world = null, bounds = null, current = null, boxes = [];
const VIEWS = [{ id: 'showcase', name: 'Kit in use', desc: 'A western street, a brick house, a castle and a stall, all assembled from the parts below.' }];
const THEMES = ['Walls and roofs', 'Medieval', 'Wild West'], KIND = { large: 'Buildings and towers', wall: 'Walls and fences', small: 'Blocks, roofs and props' };
function sheet(theme) {      // every part of a theme on one table
  const g = new THREE.Group(), items = KIT.filter(it => it.theme === theme); let x = 0, z = 0, rowD = 0;
  for (const it of items) { const b = gameBox(it), w = Math.max(1, b[1] - b[0]) + 0.9; if (x + w > 15) { x = 0; z += rowD + 1.3; rowD = 0; } const m = make(it.key); m.position.set(x - b[0], 0, z - b[2]); g.add(m); x += w; rowD = Math.max(rowD, Math.max(1, b[3] - b[2])); }

}

  const it = BY[id]; let cols = [];

    $('pname').textContent = it.name; $('pdesc').textContent = MODELS[id].desc.replace(/^./, c => c.toUpperCase());

      `<span>Height <b>${+it.h.toFixed(2)}</b> ${it.h === 1 ? 'tile' : 'tiles'} (${it.units} units)</span>`, `<span>${it.c.length ? 'Recolour: ' + it.c.length + (it.c.length === 1 ? ' part' : ' parts') : 'Fixed colours'}</span>`, `<span>${it.id}</span>`];

  const ctr = bounds.getCenter(new THREE.Vector3()); sun.position.set(ctr.x + 7, bounds.max.y + 14, ctr.z + 9); sun.target.position.copy(ctr);
  const ext = Math.max(bounds.max.x - bounds.min.x, bounds.max.z - bounds.min.z, bounds.max.y) + 3; Object.assign(sun.shadow.camera, { left: -ext, right: ext, top: ext, bottom: -ext, near: 1, far: 80 }); sun.shadow.camera.updateProjectionMatrix();

}
function fit() {

$('list').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; show(b.dataset.id); document.body.classList.remove('open'); });
const step = d => show(order[(order.indexOf(current) + d + order.length) % order.length]);

/* ───────── checks used while building this page ───────── */
window.__test = {
  check: () => { const bad = []; let n = 0;
    for (const it of KIT) { n++; const g = make(it.key, {}), bb = new THREE.Box3().setFromObject(g), b = gameBox(it), tol = 0.085, wallDepth = it.type === 'wall' ? 0.4 : 0;
      const over = [b[0] - bb.min.x, bb.max.x - b[1], b[2] - bb.min.z, bb.max.z - (b[3] + wallDepth)].map(v => +v.toFixed(3));
      if (Math.max(...over) > tol) bad.push(it.key + ' spills over its footprint by ' + Math.max(...over));
      if (bb.max.y > it.h + 0.03) bad.push(it.key + ' is taller than the game says: ' + bb.max.y.toFixed(2) + ' vs ' + it.h);
      if (bb.max.y < it.h * 0.6) bad.push(it.key + ' is much shorter than the game says: ' + bb.max.y.toFixed(2) + ' vs ' + it.h);

let prev = performance.now();
