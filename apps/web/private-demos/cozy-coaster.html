<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Coaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#fff1c2; --panel-2:#ffe7a1; --ink:#5b2a48; --ink-soft:#8a5c78;
  --edge:#e9cf86; --accent:#d6456b; --accent-ink:#fff6dc; --teal:#2f9c95; --good:#3c9a5f; --bad:#c9413f; --shadow:rgba(91,42,72,.22);
  --sky-a:#bfe6e6; --sky-b:#fde8bf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#3b2440; --panel-2:#4a2e50; --ink:#ffe9b8; --ink-soft:#d9b9c6;
    --edge:#5e3c63; --accent:#f0688a; --accent-ink:#2b1730; --teal:#58c7bf; --good:#7fd79b; --bad:#ff8f8a; --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --panel:#3b2440; --panel-2:#4a2e50; --ink:#ffe9b8; --ink-soft:#d9b9c6;
  --edge:#5e3c63; --accent:#f0688a; --accent-ink:#2b1730; --teal:#58c7bf; --good:#7fd79b; --bad:#ff8f8a; --shadow:rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:linear-gradient(180deg,var(--sky-a),var(--sky-b)); color:var(--ink); overflow:hidden; transition:background 1.2s;
  font-family:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif; font-size:15px; line-height:1.3;
  -webkit-tap-highlight-color:transparent;
}
body.night{--sky-a:#1d2444; --sky-b:#4a3562}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:16px;box-shadow:0 4px 0 var(--edge),0 10px 22px var(--shadow)}
.btn{height:38px;padding:0 11px;border-radius:12px;border:2px solid var(--edge);background:var(--panel-2);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.btn.warn{background:var(--bad);color:#fff;border-color:var(--bad)}

#hud{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:8px 12px;z-index:5;display:flex;gap:12px;align-items:center;font-weight:600;font-size:16px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 380px)}
#hud b{font-weight:800}
#goal{font-size:12.5px;color:var(--ink-soft);min-width:150px}
#goalbar{height:7px;border-radius:7px;background:var(--panel-2);border:1px solid var(--edge);margin-top:3px;overflow:hidden}
#goalfill{height:100%;width:0;background:var(--accent);transition:width .5s}
#tools{position:fixed;right:12px;top:calc(74px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:6px;z-index:5;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 380px)}
#speed{position:fixed;left:366px;top:calc(14px + env(safe-area-inset-top,0px));font-weight:800;font-size:13.5px;z-index:4;pointer-events:none;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:5px 11px;max-width:300px}
#speed:empty{display:none}
#speed small{display:block;font-weight:600;font-size:12px;color:var(--ink-soft)}

#side{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:340px;display:flex;flex-direction:column;z-index:6;overflow:hidden}
#side header{padding:12px 14px 0}
#side h1{margin:0 0 8px;font-size:22px;font-weight:800;line-height:1}
#modes{display:flex;gap:6px;padding-bottom:10px;border-bottom:2px solid var(--edge)}
#modes .btn{flex:1}
#body{flex:1;min-height:0;display:flex;flex-direction:column}
.pad{padding:10px 14px}
.hint{color:var(--ink-soft);font-weight:600;font-size:13.5px;margin:0 0 8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
select.sel{flex:1;min-width:0;height:36px;border-radius:10px;border:2px solid var(--edge);background:var(--panel-2);padding:0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0}
.chips span{background:var(--panel-2);border:1.5px solid var(--edge);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.chips span.ok{background:var(--good);border-color:var(--good);color:#fff;font-weight:800}
.chips b{font-weight:800}
.tabs{display:flex;gap:6px;padding:8px 14px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:2px solid var(--edge);background:none;border-radius:999px;padding:3px 11px;font-weight:800;font-size:12.5px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.list{flex:1;overflow:auto;padding:2px 10px 8px;overscroll-behavior:contain;min-height:0}
.list button{display:flex;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:9px;font-weight:600;font-size:14px;gap:6px;align-items:baseline}
.list button:hover{background:var(--panel-2)}
.list button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.list button.bad{opacity:.55}
.list .x{margin-left:auto;font-size:11.5px;font-weight:800;opacity:.85;white-space:nowrap}
.list small{font-weight:400;font-size:12px;opacity:.8}
.list p{margin:12px 8px;color:var(--ink-soft);font-weight:600}
.list i{width:14px;height:14px;border-radius:5px;flex:none;align-self:center}
.act{display:flex;gap:6px;padding:10px 12px 12px;border-top:2px solid var(--edge)}
.act .go{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.slabel{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform}
.sname{background:var(--panel);border:2px solid var(--edge);border-radius:999px;padding:2px 10px 1px 6px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 0 var(--edge);white-space:nowrap}
.sname i{width:12px;height:12px;border-radius:50%}
.dots{display:flex;gap:3px;height:10px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9)}
.float{position:absolute;font-weight:800;font-size:17px;color:var(--accent);text-shadow:0 2px 0 var(--panel),0 -1px 0 var(--panel),1px 0 0 var(--panel),-1px 0 0 var(--panel);animation:rise 1.4s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-56px}}
#toast{position:fixed;left:50%;top:calc(130px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);padding:9px 16px;font-weight:800;z-index:9;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
  #hud{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));max-width:none;justify-content:space-between;padding:6px 10px;font-size:15px}
  #goal{min-width:0;flex:1}
  #tools{left:8px;right:8px;top:calc(58px + env(safe-area-inset-top,0px));max-width:none;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  #tools .btn{flex:none}
  #speed{left:8px;top:calc(112px + env(safe-area-inset-top,0px))}
  #side{left:0;right:0;top:auto;bottom:0;width:auto;height:48%;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #side.small{height:auto}
  #side h1{display:none}
  #side header{padding:8px 12px 0}
  #modes{padding-bottom:8px}
  .btn{height:36px;padding:0 9px;font-size:13.5px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px 12px 0}
  .chips span{white-space:nowrap;flex:none}
}
@media (prefers-reduced-motion:reduce){.float{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="c" aria-label="Park view"></canvas>
<div id="labels"></div>
<div id="speed"></div>
<div id="hud" class="panel">
  <span title="Tickets pay for track and scenery">🎟 <b id="coins">0</b></span>

</div>
<div id="tools" class="panel">

  <button class="btn" id="rotR" title="Turn view right (E)">⟳</button>
  <button class="btn" id="zin" title="Zoom in">+</button>
  <button class="btn" id="zout" title="Zoom out">−</button>
  <button class="btn" id="night" aria-pressed="false">Evening</button>
  <button class="btn" id="snd" aria-pressed="true">Sound</button>
  <button class="btn" id="reset">New park</button>
</div>
<aside id="side" class="panel">

      <button class="btn" data-mode="look" aria-pressed="false">Look</button>
    </div>
  </header>
  <div id="body"></div>
</aside>
<div id="toast" class="panel"></div>

}
function tryAdd() { const c = cands.find(c => c.n === selected); if (cur && c && !c.bad && !cur.closed) addPiece(cur, selected); }
let delArmed = 0;
$('side').addEventListener('click', e => {
  initAudio(); const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.mode) { mode = d.mode; if (mode !== 'ride') { /* keep cur */ } refreshPanel(); return; }
  if (d.theme) { scn.theme = d.theme; scn.key = KIT.find(k => k.theme === d.theme).key; scn.remove = false; refreshPanel(); return; }

function updateHUD() {

}

/* ───────── ghosts and hover ───────── */
const headMark = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.3, 12), L(0x3c9a5f)); scene.add(headMark);
const hoverSq = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([[0,-.5],[1,-.5],[1,.5],[0,.5]].map(p => new THREE.Vector3(p[0], 0, p[1]))), new THREE.LineBasicMaterial({ color: 0xffffff, depthTest: false })); hoverSq.renderOrder = 10; hoverSq.visible = false; scene.add(hoverSq);
let ghostKey = '';
function showGhost() {

  if (mode === 'ride' && cur) {
    const r = cur; if (!r.closed) { const t = rotY(ideal(r.head.pitch, r.head.heading % 90 !== 0), r.head.heading); headMark.visible = true; headMark.position.copy(r.head.pos).addScaledVector(t, 0.05); headMark.position.y += r.head.roll === 'upsideDown' ? -0.3 : 0.3; headMark.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), t);
      if (selected) { const c = cands.find(c => c.n === selected); ghost = makePiece(selected, r.head.pos, r.head.heading, c && c.bad ? 'bad' : 'ok'); scene.add(ghost); } }

  else hoverSq.material.color.set(scn.remove && mode === 'scenery' ? 0xc9413f : 0xffffff);

/* ───────── input: drag moves the view, a tap acts ───────── */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

function pickRide(e) { const hit = pick(e).intersectObjects(rides.flatMap(r => r.placed), true)[0]; if (!hit) return null; let o = hit.object; while (o && !o.userData.ride) o = o.parent; return o ? o.userData.ride : null; }
function panBy(dx, dy) { const wpp = 2 * cam.zoom / window.innerHeight, sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw), k = dy * wpp / Math.sin(ELEV);
  cam.targetT.x = clamp(cam.targetT.x - sy * dx * wpp - cy * k, -2, N + 2); cam.targetT.z = clamp(cam.targetT.z + cy * dx * wpp - sy * k, -2, N + 2); cam.target.copy(cam.targetT); }
const ptrs = new Map(); let pinch = 0, mid = null, moved = 0;
function tap(e) {

    const s = { key: scn.key, i: t[0], j: t[1], rot: scn.rot, y: baseY(t[0], t[1]) + scn.lift }, why = sceneryProblem(s) || (scnCost(s.key) > tickets ? 'not enough tickets' : '');

canvas.addEventListener('pointerdown', e => { initAudio(); try { canvas.setPointerCapture(e.pointerId); } catch (_) {} ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = ptrs.size > 1 ? 99 : 0;

  if (had && moved <= 6 && e.button === 0) { if (e.pointerType !== 'mouse') { hoverTile = pickTile(e); } tap(e); if (e.pointerType !== 'mouse' && !(mode === 'ride' && cur)) showGhost(); } });

const keys = {};
window.addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === 'SELECT') return; const k = e.key.toLowerCase(); keys[k] = true;
  if (k === 'q') cam.yawT += Math.PI / 2; else if (k === 'e') cam.yawT -= Math.PI / 2;
  else if (k === 'enter') { tryAdd(); e.preventDefault(); } else if ((k === 'backspace' || k === 'z') && mode === 'ride' && cur) { undoPiece(cur); e.preventDefault(); }

$('rotL').addEventListener('click', () => cam.yawT += Math.PI / 2); $('rotR').addEventListener('click', () => cam.yawT -= Math.PI / 2);

  resetArmed = Date.now() + 3000; b.textContent = 'Erase everything?'; b.classList.add('warn'); setTimeout(() => { if (resetArmed && Date.now() >= resetArmed) { b.textContent = 'New park'; b.classList.remove('warn'); resetArmed = 0; } }, 3100); });

  hemi.color.set(on ? 0x8a94d6 : 0xfff4dc); hemi.groundColor.set(on ? 0x3b3157 : 0x9fb58a); hemi.intensity = on ? 0.5 : 0.6; sun.color.set(on ? 0x9fb2ff : 0xffe2b0); sun.intensity = on ? 0.28 : 0.6;

/* ───────── save, load, starter park ───────── */
let saveT; function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 500); }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ tickets, smiles, night,
    rides: rides.map(r => ({ s: [r.start.pos.x, r.start.pos.y, r.start.pos.z, r.start.heading], q: r.seq.map((n, i) => n + (r.lifts[i] ? '+' : '')), c: r.color, k: r.coaster, n: r.carried, e: r.earned, b: r.best })),
    scenery: scenery.map(s => [s.key, s.i, s.j, s.rot, s.y]) })); } catch (e) {} }
function loadRide(d) { const r = newRide(new THREE.Vector3(d.s[0], d.s[1], d.s[2]), d.s[3], d.c, d.k); r.seq = d.q.map(n => n.replace(/\+$/, '')); r.lifts = d.q.map(n => /\+$/.test(n)); r.carried = d.n | 0; r.earned = d.e | 0; r.best = d.b || null; rebuildRide(r); return r; }
const STARTER = { rides: [{ s: [13, 0, 5, 180], c: RAILS[0], k: 'LoopingRollerCoaster', q: ['middleStation', 'middleStation', 'middleStation', 'flatToUp25+', 'up25+', 'up25+', 'up25+', 'up25+', 'up25+', 'up25ToFlat+', 'leftQuarterTurn5Tiles', 'leftQuarterTurn5Tiles',
    'flatToDown25', 'down25ToDown60', 'down60ToDown25', 'down25', 'down25ToFlat', 'brakes', 'rightQuarterTurn3Tiles', 'middleStation', 'middleStation', 'middleStation'] }],
  scenery: [['large.saloon', 15, 2, 0, 0], ['large.genstore', 18, 2, 0, 0], ['small.wag1', 17, 4, 20, 0], ['small.teepee1', 21, 4, 0, 0], ['large.soh1', 23, 12, 180, 0.5], ['large.soh3', 24, 12, 180, 0.5], ['large.sct', 19, 13, 0, 0.5]] };
function clearAll() { rides.slice().forEach(r => { r.placed.forEach(g => scene.remove(g)); if (r.supports) scene.remove(r.supports); r.train.cars.forEach(c => scene.remove(c)); }); rides = []; scenery.forEach(s => scene.remove(s.mesh)); scenery = []; cur = null; rideSeq = 1; }
function applyState(d, fresh) {
  clearAll(); tickets = Number.isFinite(d.tickets) ? d.tickets : START_TICKETS; smiles = d.smiles | 0;
  PLACES.forEach((pl, i) => { pl.queue = []; setUnlocked(pl, smiles >= UNLOCK[i]); });
  (d.scenery || []).forEach(a => { if (BY[a[0]]) placeScenery({ key: a[0], i: a[1], j: a[2], rot: a[3], y: a[4] }, true); });
  (d.rides || []).forEach(x => { if (x.q.every(n => P[n.replace(/\+$/, '')])) loadRide(x); });

function newPark(announce) { applyState({ tickets: START_TICKETS, smiles: 0, rides: STARTER.rides, scenery: STARTER.scenery }); save(); if (announce) toast('A fresh park with one starter ride'); }

window.__test = {
  state: () => ({ tickets, smiles, rides: rides.map(r => ({ id: r.id, n: r.seq.length, closed: r.closed, len: +r.path.len.toFixed(1), runs: r.path.runs.map(x => x.serves.map(a => PLACES[a].name)), stars: stars(r), fare: fare(r), carried: r.carried, state: r.train.state, note: r.train.note, riders: r.train.riders.length, best: r.best && { kmh: kmh(r.best.maxV), g: +r.best.maxG.toFixed(1) } })), scenery: scenery.length, queues: PLACES.map(p => p.queue.length) }),
  sim: secs => { for (let i = 0; i < secs * 120; i++) { rides.forEach(r => stepTrain(r, 1 / 120)); if (i % 240 === 0) spawnGuest(); } },
  check: () => { const out = []; rides.forEach(r => { let st = startState(r); const save = occ; occ = new Map(); PLACES.forEach(pl => addOcc({ o: 'place', kx: pl.i, kz: pl.j, y0: baseY(pl.i, pl.j), y1: baseY(pl.i, pl.j) + 1.25, m: 15 }));
      r.seq.forEach(n => { const bl = blocksOf(r, n, st); for (const b of bl) { if (!inMap(b.kx, b.kz)) out.push(n + ' off map'); else if (b.y0 < Math.max(0, orig(b.kx, b.kz) - DIG) - 0.011) out.push(n + ' underground at ' + b.kx + ',' + b.kz); } if (hits(bl)) out.push(n + ' collides'); bl.forEach(addOcc); st = advance(st, n); }); occ = save; }); return out; },
  start: (i, j, h) => { startHeading = h; startRideAt(i, j); return cur && cur.id; }, build: n => { selected = n; refreshPanel(null); const c = cands.find(c => c.n === n); if (!c) return 'not offered'; if (c.bad) return c.bad; addPiece(cur, n); return 'ok'; },
  lift: on => { liftOn = on; }, mode: m => { mode = m; refreshPanel(); }, place: (key, i, j, rot, lift) => { const s = { key, i, j, rot: rot || 0, y: baseY(i, j) + (lift || 0) }, why = sceneryProblem(s); if (why) return why; placeScenery(s); return 'ok'; },
  done: () => { cur = null; refreshPanel(); }, look: (x, z, zoom) => { cam.targetT.set(x, 0.5, z); cam.target.copy(cam.targetT); cam.zoom = cam.zoomT = zoom; }, newPark,
};

/* ───────── go ───────── */
(function () { let d = null; try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light') setNight(true);
  if (d && Array.isArray(d.rides)) { applyState(d); if (d.night !== undefined) setNight(!!d.night); } else newPark(false); })();
resize();
let prev = performance.now(), acc = 0;

    let html = t.state === 'run' ? `${kmh(t.v)} km/h, ${t.gV.toFixed(1)} G${what ? ', ' + what.toLowerCase() : ''}` : what; const b = cur.best;
    if (b) html += `<small>Best run: ${kmh(b.maxV)} km/h, ${b.maxG.toFixed(1)} G down, ${b.minG.toFixed(1)} G lightest, ${b.maxL.toFixed(1)} G sideways</small>`; if ($('speed').innerHTML !== html) $('speed').innerHTML = html; }
  else if ($('speed').innerHTML) $('speed').innerHTML = '';

}
