<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Grid Down Acres: Homestead</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Karla:wght@400;600;800&display=swap">
<style>
:root{
  --chalk:#fbf7ea; --ink:#1c2a23; --field:#2f6b46; --sun:#f0b429; --barn:#a8483a; --sky:#8fd3dc;
  --card:var(--chalk); --text:var(--ink); --edge:var(--ink); --dim:rgba(28,42,35,.62); --neg:#a8483a; --pos:#2f6b46;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --card:#1c2a23; --text:#fbf7ea; --edge:#fbf7ea; --dim:rgba(251,247,234,.66); --neg:#f08a78; --pos:#7fd39a; }
}
:root[data-theme="dark"]{ --card:#1c2a23; --text:#fbf7ea; --edge:#fbf7ea; --dim:rgba(251,247,234,.66); --neg:#f08a78; --pos:#7fd39a; }
*{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:#8fd3dc; color:var(--text); overflow:hidden;
  font-family:Karla,system-ui,-apple-system,Segoe UI,sans-serif; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
#c{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none}
#dusk{position:fixed; inset:0; background:#1b2440; opacity:0; pointer-events:none; transition:opacity .5s}
#dusk.on{opacity:.55}
#top{position:fixed; left:0; right:0; top:0; pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 8px) 0 calc(env(safe-area-inset-left,0px) + 8px)}
.bar{background:var(--card); color:var(--text); border:2px solid var(--edge); border-radius:4px; box-shadow:3px 3px 0 var(--edge); padding:6px 9px 7px}
.row1{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
#day{font-family:"Alfa Slab One",Georgia,serif; font-size:17px; line-height:1.1}
#wx{font-size:13px; font-weight:800}
#wx2{font-size:12.5px; color:var(--dim); font-weight:600}
.chips{display:grid; grid-template-columns:repeat(5,auto); gap:4px 12px; margin-top:5px; font-variant-numeric:tabular-nums; justify-content:space-between}
.chip{font-size:12px; line-height:1.15}
.chip b{display:block; font-size:15px; font-weight:800}
.chip.low b{color:var(--neg)}
#toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 108px); transform:translate(-50%,-6px); width:min(92vw,430px); padding:9px 12px; font-size:13.5px; line-height:1.35;
  background:#1c2a23; color:#fbf7ea; border-left:6px solid var(--sun); border-radius:3px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none}
#toast.show{opacity:1; transform:translate(-50%,0)}
#toast b{color:var(--sun)}
#endbtn{position:fixed; right:calc(env(safe-area-inset-right,0px) + 12px); bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  font-family:"Alfa Slab One",Georgia,serif; font-size:16px; padding:12px 16px; background:var(--sun); color:#1c2a23; border:3px solid #1c2a23; border-radius:4px; box-shadow:0 4px 0 #1c2a23; cursor:pointer; touch-action:manipulation; max-width:70vw}
#endbtn:active{transform:translateY(3px); box-shadow:0 1px 0 #1c2a23}
#endbtn.arm{background:var(--barn); color:#fff}
#sheet{position:fixed; left:0; right:0; bottom:0; max-height:52%; overflow:auto; background:var(--card); color:var(--text); border-top:3px solid var(--edge);
  padding:12px calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px); transform:translateY(105%); transition:transform .18s}
#sheet.show{transform:none}
#sheet .in{max-width:520px; margin:0 auto}
#sheet h2{font-family:"Alfa Slab One",Georgia,serif; font-weight:400; font-size:19px; margin:0 34px 2px 0}
#sheet .sub{font-size:13.5px; color:var(--dim); margin:0 0 9px; line-height:1.35}
#sheetx{position:absolute; right:calc(env(safe-area-inset-right,0px) + 10px); top:8px; width:34px; height:34px; border:2px solid var(--edge); border-radius:4px; background:transparent; color:var(--text); font:800 16px Karla,sans-serif; cursor:pointer}
.opt{display:grid; grid-template-columns:1fr auto; gap:2px 10px; width:100%; text-align:left; padding:9px 10px; margin:0 0 7px; background:transparent; color:var(--text); border:2px solid var(--edge); border-radius:4px; font:inherit; cursor:pointer; touch-action:manipulation}
.opt .t{font-weight:800; font-size:14.5px}
.opt .c{font-weight:800; font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums}
.opt .d{grid-column:1 / -1; font-size:12.5px; color:var(--dim); line-height:1.3}
.opt:disabled{opacity:.5; cursor:default; border-style:dashed}
.opt:not(:disabled):active{background:var(--sun); color:#1c2a23}
.opt:not(:disabled):active .d{color:#1c2a23}
.opt.go{background:var(--sun); color:#1c2a23; border-color:#1c2a23} .opt.go .d{color:#1c2a23}
.opt:focus-visible,#endbtn:focus-visible,#sheetx:focus-visible{outline:3px solid var(--sky); outline-offset:2px}
.ov{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px); background:rgba(28,42,35,.55); overflow:auto}
.ov.hidden{display:none}
.paper{width:min(100%,440px); max-height:100%; overflow:auto; background:var(--card); color:var(--text); border:3px solid var(--edge); border-radius:6px; box-shadow:6px 6px 0 var(--edge); padding:18px 18px 12px}
.paper h1{font-family:"Alfa Slab One",Georgia,serif; font-weight:400; font-size:27px; line-height:1; margin:0 0 10px}
.paper p{margin:0 0 10px; font-size:14.5px; line-height:1.45}
table.led{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; margin-bottom:10px}
table.led td{padding:3px 0; vertical-align:top}
table.led td:last-child{text-align:right; white-space:nowrap; padding-left:10px; font-weight:600}
table.led tr.sec td{font-weight:800; padding-top:8px; border-bottom:2px solid var(--edge)}
table.led tr.tot td{font-weight:800; border-top:2px solid var(--edge); padding-top:6px; font-size:15.5px}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.meter{height:16px; border:2px solid var(--edge); border-radius:3px; margin:4px 0 8px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--field); width:0}
.note{font-size:13.5px; border-left:5px solid var(--sun); padding:2px 0 2px 9px; margin:0 0 10px; line-height:1.4}
</style>
</head>
<body>
<canvas id="c" aria-label="Your homestead"></canvas>
<div id="dusk"></div>

<div id="top">
  <div class="bar">
    <div class="row1"><span id="day"></span><span id="wx"></span><span id="wx2"></span></div>
    <div class="chips">
      <div class="chip" id="cmoney">Money<b></b></div>
      <div class="chip" id="cenergy">Energy<b></b></div>
      <div class="chip" id="cpower">Power<b></b></div>
      <div class="chip" id="cwater">Water<b></b></div>
      <div class="chip" id="css">Off-grid<b></b></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<button id="endbtn" type="button">End the day</button>

<div id="sheet"><div class="in">
  <button id="sheetx" type="button" aria-label="Close">X</button>
  <h2 id="sheett"></h2><p class="sub" id="sheets"></p><div id="sheeto"></div>
</div></div>

<div id="modal" class="ov"><div class="paper"><h1 id="mt"></h1><div id="mb"></div><div id="mo"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var canvas=$('c');
function fatal(msg){ $('mt').textContent='Grid Down Acres'; $('mb').innerHTML='<p>'+msg+'</p>'; $('mo').innerHTML=''; }
if(typeof THREE==='undefined'){ fatal('The 3D library did not load. Check your connection and reload the page.'); return; }
var renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true}); }
catch(e){ fatal('This browser could not start WebGL, so the farm cannot be drawn. Try another browser or device.'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

/* ================= rules ================= */
var N=16, DAYS=10, START=650;
var DEF={
  plot:{n:'Veg plot',w:1,h:1,c:12,e:1,d:'Grow lettuce, potatoes or tomatoes'},
  meadow:{n:'Wildflower patch',w:1,h:1,c:8,e:1,d:'Bees love it. So, secretly, does the HOA'},
  solar:{n:'Solar panel',w:1,h:1,c:110,e:2,d:'6 power on a sunny day, 2 under cloud, 0 in a storm'},
  battery:{n:'Battery',w:1,h:1,c:80,e:1,d:'Stores 8 more power'},
  tank:{n:'Rain tank',w:1,h:1,c:55,e:1,d:'Holds 40 more water and catches more rain'},
  pump:{n:'Well pump',w:1,h:1,c:130,e:2,d:'Turns 2 power into 15 water every night'},
  turbine:{n:'Wind turbine',w:1,h:1,c:150,e:3,d:'1 to 2 power most days, 5 in a storm'},
  hive:{n:'Beehive',w:1,h:1,c:70,e:1,d:'Honey every 2 days, daily with 2 wildflower patches close by. Crops within 2 squares yield 1 more'},
  coop:{n:'Chicken coop',w:2,h:2,c:100,e:3,d:'3 eggs a day. Costs $5 feed and 2 water a night'},
  pen:{n:'Sheep pen',w:2,h:2,c:170,e:3,d:'Wool every 3 days if they get 3 water a night',req:1},
  green:{n:'Greenhouse',w:2,h:2,c:190,e:4,d:'4 greens a night for 1 power and 3 water, whatever the weather'}
};
var ORDER=['plot','meadow','solar','battery','tank','pump','turbine','hive','coop','pen','green'];
var CROP={lettuce:{n:'Lettuce',seed:4,days:2,y:3,water:2,col:0x9ad96f},potato:{n:'Potatoes',seed:6,days:3,y:5,water:2,col:0x4f8a45},tomato:{n:'Tomatoes',seed:10,days:4,y:6,water:4,col:0x5aa04c}};
var PRICE={wool:18,honey:14,tomato:8,lettuce:6,greens:6,potato:5,egg:4};
var SELL=['wool','honey','tomato','lettuce','greens','potato','egg'], EAT=['potato','egg','lettuce','greens','tomato'], PERISH=['lettuce','tomato','greens'];
var NAME={wool:'wool',honey:'honey',tomato:'tomatoes',lettuce:'lettuce',greens:'greens',potato:'potatoes',egg:'eggs'};
var WX={sun:{n:'Sunny',solar:6,wind:1,rain:0,mult:1,sky:0x9fd8e6,li:1},cloud:{n:'Cloudy',solar:2,wind:2,rain:0,mult:1,sky:0xbccbcc,li:0.75},
  rain:{n:'Rain',solar:1,wind:2,rain:12,mult:0,sky:0x93a9b0,li:0.6},storm:{n:'Storm',solar:0,wind:5,rain:18,mult:0,sky:0x70818b,li:0.45},
  heat:{n:'Heatwave',solar:7,wind:1,rain:0,mult:2,sky:0xf2dca6,li:1.1}};
var HOUSE=[{n:'Fix the roof',c:90,e:4,d:'Sleep dry. 2 more energy every day'},{n:'Rebuild the kitchen',c:130,e:4,d:'Jam and pickles: nothing spoils and everything sells for 25% more'},{n:'Rewire and insulate',c:140,e:4,d:'House uses 2 power a night instead of 3. Battery holds 6 more'}];
var BARN=[{n:'Patch the walls',c:100,e:4,d:'Keeps foxes out and lets you keep sheep'},{n:'Rebuild the hay loft',c:90,e:3,d:'Chicken feed drops from $5 to $2 a night'},{n:'Open a farm shop',c:180,e:5,d:'Sell 16 things a day instead of 6'}];

var S={day:1,money:START,energy:10,batt:3,water:20,house:0,barn:0,stock:{wool:0,honey:0,tomato:0,lettuce:0,greens:0,potato:0,egg:0},
  weather:[],tractor:false,grid:false,viral:false,eggOrder:false,foxProof:false,used:{},pw:[],fd:[],over:false};
var L={stand:0,other:0,scrap:0,gen:0,groc:0,feed:0,seed:0,fines:0,build:0,repair:0};
var grid=[], ents=[];
for(var gi=0;gi<N;gi++){ grid.push([]); for(var gj=0;gj<N;gj++) grid[gi].push(null); }
(function(){ var bag=['sun','sun','sun','sun','cloud','cloud','rain','rain','storm','heat'];
  S.weather.push('sun'); for(var d=1;d<DAYS;d++) S.weather.push(bag[Math.floor(Math.random()*bag.length)]);
  if(S.weather.indexOf('rain')<0&&S.weather.indexOf('storm')<0) S.weather[3]='rain'; })();

function count(t){ var n=0; for(var i=0;i<ents.length;i++) if(ents[i].type===t) n++; return n; }
function battCap(){ return 6+8*count('battery')+(S.house>=3?6:0); }
function waterCap(){ return 20+40*count('tank'); }
function maxEnergy(){ return 10+(S.house>=1?2:0)+(S.tractor?3:0); }
function houseUse(){ return S.house>=3?2:3; }
function weekend(){ return S.day%7===6||S.day%7===0; }
function standCap(){ return (S.barn>=3?16:6)*(weekend()?2:1)*(S.viral?2:1); }
function priceOf(k){ return Math.round(PRICE[k]*(S.house>=2?1.25:1)); }
function stockTotal(){ var n=0; for(var k in S.stock) n+=S.stock[k]; return n; }
function avg(a){ if(!a.length) return 0; var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s/a.length; }
function selfSuff(){ return Math.round(40*avg(S.pw)*(S.grid?0.5:1)+35*avg(S.fd)+25*(S.house+S.barn)/6); }
function pay(c,cat){ S.money-=c; L[cat]+=c; }
function earn(c,cat){ S.money+=c; L[cat]+=c; }
function why(c,e){ if(S.energy<e) return 'Not enough energy left today'; if(S.money<c) return 'Not enough money'; return ''; }
function cost(c,e){ var a=[]; if(c) a.push('$'+c); if(e) a.push(e+' energy'); return a.join(', '); }
function near(e,type,r){ var n=0; for(var i=0;i<ents.length;i++){ var o=ents[i]; if(o.type===type&&Math.max(Math.abs(o.i-e.i),Math.abs(o.j-e.j))<=r) n++; } return n; }
function free(i,j,w,h){ for(var a=i;a<i+w;a++) for(var b=j;b<j+h;b++){ if(a<0||b<0||a>=N||b>=N||grid[a][b]) return false; } return true; }

function place(type,i,j,extra){
  var d=DEF[type]||{w:1,h:1}, e={type:type,i:i,j:j,w:(extra&&extra.w)||d.w||1,h:(extra&&extra.h)||d.h||1};
  if(type==='plot'){ e.crop=null; e.g=0; e.dry=0; }
  if(type==='coop'){ e.hens=3; }
  if(type==='pen'){ e.wool=0; }
  if(type==='hive'){ e.prog=0; }
  if(type==='solar'){ e.broken=false; }
  for(var a=i;a<i+e.w;a++) for(var b=j;b<j+e.h;b++) grid[a][b]=e;
  ents.push(e); if(view) view.add(e); return e;
}
function removeEnt(e){ for(var a=e.i;a<e.i+e.w;a++) for(var b=e.j;b<e.j+e.h;b++) grid[a][b]=null;
  ents.splice(ents.indexOf(e),1); if(view) view.remove(e); S.batt=Math.min(S.batt,battCap()); S.water=Math.min(S.water,waterCap()); }
function build(type,i,j){ var d=DEF[type]; if(why(d.c,d.e)||!free(i,j,d.w,d.h)) return null; if(d.req&&S.barn<d.req) return null;
  pay(d.c,'build'); S.energy-=d.e; return place(type,i,j); }
function plant(e,k){ var c=CROP[k]; if(why(c.seed,1)||e.crop) return false; pay(c.seed,'seed'); S.energy-=1; e.crop=k; e.g=0; e.dry=0; if(view) view.refresh(e); return true; }
function ripe(e){ return e.type==='plot'&&e.crop&&e.g>=CROP[e.crop].days; }
function harvest(e){ if(!ripe(e)||S.energy<1) return 0; var y=CROP[e.crop].y+(near(e,'hive',2)?1:0); S.stock[e.crop]+=y; S.energy-=1; e.crop=null; e.g=0; if(view) view.refresh(e); return y; }
function repair(which){ var list=which==='house'?HOUSE:BARN, st=list[S[which]]; if(!st||why(st.c,st.e)) return false; pay(st.c,'repair'); S.energy-=st.e; S[which]++; if(view) view.refreshAll(); return true; }

/* ---------- the night ---------- */
function night(){
  var w=WX[S.weather[S.day-1]], rows=[], notes=[], i, e;
  // power
  var gen=0; ents.forEach(function(e){ if(e.type==='solar'&&!e.broken) gen+=w.solar; if(e.type==='turbine') gen+=w.wind; });
  S.batt=Math.min(battCap(),S.batt+gen);
  var need=houseUse(), met=Math.min(need,S.batt); S.batt-=met; var short=need-met;
  ents.forEach(function(e){ if(e.type==='pump'){ need+=2; e.ran=S.batt>=2; if(e.ran){S.batt-=2; met+=2;} }
    if(e.type==='green'){ need+=1; e.pow=S.batt>=1; if(e.pow){S.batt-=1; met+=1;} } });
  rows.push(['Power made today',gen]); rows.push(['Power needed tonight',need+', you had '+met]);
  if(short>0){ var gc=short*(S.grid?2:6); pay(gc,'gen'); rows.push([S.grid?'Bought from the grid':'Generator fuel',-gc,1]); }
  S.pw.push(met/need);
  // water
  var conts=1+count('tank'), rain=w.rain*conts, pumped=0;
  ents.forEach(function(e){ if(e.type==='pump'&&e.ran) pumped+=15; });
  S.water=Math.min(waterCap(),S.water+rain+pumped);
  if(rain+pumped>0) rows.push(['Water collected',rain+pumped]);
  var died=0, thirsty=0;
  ents.forEach(function(e){ if(e.type!=='plot'||!e.crop||ripe(e)) return;
    var wn=CROP[e.crop].water*w.mult;
    if(S.water>=wn){ S.water-=wn; e.g++; e.dry=0; } else { e.dry++; thirsty++; if(e.dry>=2){ e.crop=null; e.g=0; e.dry=0; died++; } } });
  if(thirsty) notes.push(thirsty+(thirsty===1?' plot':' plots')+' went without water'+(died?', and '+died+' died':'')+'.');
  // animals and greenhouse
  var feed=0, eggs=0, greens=0;
  ents.forEach(function(e){
    if(e.type==='coop'){ var f=S.barn>=2?2:5; feed+=f; if(S.water>=2){ S.water-=2; eggs+=e.hens; } }
    if(e.type==='pen'){ if(S.water>=3){ S.water-=3; if(e.wool<3) e.wool++; } }
    if(e.type==='green'){ if(e.pow&&S.water>=3){ S.water-=3; greens+=4; } }
    if(e.type==='hive'){ e.prog+=near(e,'meadow',2)>=2?2:1; if(e.prog>=2){ e.prog-=2; S.stock.honey++; } } });
  if(feed){ pay(feed,'feed'); rows.push(['Chicken feed',-feed,1]); }
  S.stock.egg+=eggs; S.stock.greens+=greens;
  // supper
  var own=0; for(i=0;i<EAT.length&&own<3;i++){ while(S.stock[EAT[i]]>0&&own<3){ S.stock[EAT[i]]--; own++; } }
  S.fd.push(own/3);
  if(own<3){ var g=(3-own)*7; pay(g,'groc'); rows.push(['Groceries from the supermarket',-g,1]); }
  rows.push(['Meals from your own land',own+' of 3']);
  // egg order
  if(S.eggOrder&&S.stock.egg>0){ S.stock.egg--; earn(6,'other'); rows.push(['Mrs. Alvarez, one egg',6,1]); }
  // farm stand
  var cap=standCap(), sold=0, take=0;
  for(i=0;i<SELL.length&&sold<cap;i++){ var k=SELL[i], n=Math.min(S.stock[k],cap-sold); if(n>0){ S.stock[k]-=n; sold+=n; take+=n*priceOf(k); } }
  if(sold){ earn(take,'stand'); rows.push(['Farm stand, '+sold+' sold'+(weekend()?' (weekend)':''),take,1]); }
  else rows.push(['Farm stand','nothing to sell']);
  // spoilage
  if(S.house<2){ var sp=0; PERISH.forEach(function(k){ var l=Math.ceil(S.stock[k]/2); S.stock[k]-=l; sp+=l; }); if(sp) notes.push(sp+' unsold veg went soft overnight. A kitchen would have pickled it.'); }
  // storm
  if(S.weather[S.day-1]==='storm'){ var br=0; ents.forEach(function(e){ if(e.type==='solar'&&!e.broken&&Math.random()<0.25){ e.broken=true; br++; } });
    if(br) notes.push('The storm knocked '+br+(br===1?' panel':' panels')+' loose. Tap them to fix them.'); }
  if(S.tractor&&Math.random()<0.25){ pay(25,'fines'); rows.push(['Tractor repair. Again',-25,1]); }
  var jess;
  if(short>0&&!S.grid) jess='The generator ran all night. Very off-grid of you.';
  else if(own===0) jess='You drove to the supermarket for lettuce. In the truck. Past your own garden.';
  else if(died) jess='Plants need water. I am told this is widely known.';
  else if(own===3&&short===0) jess='Fed and powered by your own land. Do not let it go to your head.';
  else jess='Still standing. So is the barn, mostly.';
  S.viral=false;
  if(view) view.refreshAll();
  return {rows:rows,notes:notes,jess:jess};
}

/* ---------- events ---------- */
var EV=[
 {id:'inspector',cond:function(){return ents.filter(function(e){return DEF[e.type];}).length>=3;},t:'The county inspector',
  x:'A man with a clipboard is measuring your yard and frowning at it. "Unpermitted agricultural alterations."',
  o:[{t:'Pay for the permit',c:'$45',ok:function(){return S.money>=45;},f:function(){pay(45,'fines'); return 'Permit paid. He measured the mailbox on the way out.';}},

canvas.addEventListener('contextmenu',function(e){ e.preventDefault(); });

/* ================= loop ================= */
var T=0;
function tick(dt){
  T+=dt;
  if(camGoal){ camT.x+=(camGoal.x-camT.x)*Math.min(1,dt*6); camT.z+=(camGoal.z-camT.z)*Math.min(1,dt*6); if(Math.abs(camGoal.x-camT.x)+Math.abs(camGoal.z-camT.z)<0.02) camGoal=null; }
  camPlace();
  var wname=S.weather[Math.min(S.day,DAYS)-1], wind=WX[wname].wind;
  for(var i=0;i<spin.length;i++) spin[i].o.rotation.z-=dt*(1+wind*1.6);
  for(i=0;i<wander.length;i++){ var a=wander[i]; a.t-=dt; if(a.t<=0){ a.t=1+Math.random()*3; a.a=Math.random()*6.283; a.mv=Math.random()<0.6; }
    if(a.mv){ a.x+=Math.cos(a.a)*a.s*dt; a.z+=Math.sin(a.a)*a.s*dt; if(Math.abs(a.x)>a.r||Math.abs(a.z)>a.r){ a.x=Math.max(-a.r,Math.min(a.r,a.x)); a.z=Math.max(-a.r,Math.min(a.r,a.z)); a.a+=Math.PI; } a.o.rotation.y=Math.atan2(Math.cos(a.a),Math.sin(a.a)); }
    a.o.position.set(a.x,0,a.z); }
  for(i=0;i<flags.length;i++){ if(flags[i].visible){ flags[i].rotation.y=T*2; flags[i].position.y=0.95+Math.sin(T*3+i)*0.06; } }
  for(i=0;i<ents.length;i++){ var e=ents[i]; if(e.pop!==undefined&&e.pop<1){ e.pop=Math.min(1,e.pop+dt*4); var k=1-Math.pow(1-e.pop,3); e.mesh.scale.setScalar(Math.max(0.01,k)); } }
  if(rainM.visible){ for(i=0;i<rainN;i++){ var p=rainP[i]; p[1]-=dt*16; if(p[1]<0) p[1]=14; dummy.position.set(camT.x+p[0],p[1],camT.z+p[2]); dummy.updateMatrix(); rainM.setMatrixAt(i,dummy.matrix); } rainM.instanceMatrix.needsUpdate=true; }
  if(toastT>0){ toastT-=dt; if(toastT<=0) elToast.classList.remove('show'); }
  else if(toastQ.length){ elToast.innerHTML=toastQ.shift(); elToast.classList.add('show'); toastT=4.2; }
}
var last=0;
function frame(now){ var dt=Math.min(0.05,(now-last)/1000||0.016); last=now; tick(dt); renderer.render(scene,cam); requestAnimationFrame(frame); }

hud();
modal('Grid Down Acres','<p>You sold the townhouse, bought the wreck at the end of Willow Crescent, and told the power company to stop calling.</p>'+
  '<p>You have 10 days, $'+START+' and a farmhand called Jess. Every night the house needs 3 power and you need 3 meals. Whatever your land cannot supply, you buy: generator fuel and supermarket lettuce.</p>'+
  '<p>Tap any empty square to build on it. Tap the house, the barn or anything else to work on it. Drag to move, pinch to zoom. Everything costs energy, so you will not finish the list.</p>',
  [{t:'Start day 1',go:1,f:function(){ say('<b>Jess:</b> Morning. Start with a solar panel and a couple of veg plots, or do not, and see what the generator costs.'); }}]);
window.__game={S:S,L:L,ents:ents,grid:grid,build:build,plant:plant,harvest:harvest,repair:repair,ripe:ripe,night:night,select:select,tick:tick,endDay:endDay,selfSuff:selfSuff,free:free,scene:scene,cam:cam,pick:pick};
requestAnimationFrame(frame);
})();
